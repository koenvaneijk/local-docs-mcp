[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-docs-mcp"
version = "0.4.0"
description = "Local multi-folder document full-text search, OCR, Windows tray, and MCP tools"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.6,<2",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
tray = ["pystray>=0.19.5,<1", "Pillow>=10,<13"]

[project.scripts]
local-docs-index = "local_docs_mcp.cli:main"
local-docs-search = "local_docs_mcp.search_ui:main"
local-docs-tray = "local_docs_mcp.tray:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["local_docs_mcp*"]
